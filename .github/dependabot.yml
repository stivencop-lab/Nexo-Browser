version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    ignore:
      # maven.cefrium.com devuelve private_source_authentication_failure a Dependabot;
      # Cefrium se actualiza manualmente verificando los hashes en gradle/cefrium-*.sha256.
      - dependency-name: "com.cefrium:*"
      - dependency-name: "com.cefrium"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
