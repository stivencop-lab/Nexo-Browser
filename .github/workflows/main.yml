name: Nexo Secure CI and Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Acción a ejecutar"
        required: true
        type: choice
        default: build
        options:
          - build
          - release
      tag:
        description: "Tag opcional (solo release; vacío = v<versionName>)"
        required: false
        default: ""
  pull_request: {}
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/main.yml"

# Mínimo privilegio por defecto. Solo el job de release eleva
# contents a write, y únicamente desde main.
permissions:
  contents: read

concurrency:
  group: nexo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # GeckoView 159 exige compileSdk 37 y Android Gradle Plugin 9.
  ANDROID_PLATFORM: "37.2"
  BUILD_TOOLS: "37.0.0"
  GRADLE_VERSION: "9.8.2"

jobs:
  ci:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        transition: [false, true]
    env:
      NEXO_TRANSITION: ${{ matrix.transition }}

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v5

      - name: Security source policy
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"

          if grep -R --line-number --fixed-strings 'useMultiprocess(false)' app/src; then
            echo "::error::No se permite desactivar el multiproceso de Gecko"
            exit 1
          fi

          if grep -R --line-number 'loadUri("javascript:' app/src; then
            echo "::error::No se permite loadUri(javascript:...)"
            exit 1
          fi

          if grep -R --line-number 'remoteDebuggingEnabled(true)' app/src; then
            echo "::error::No se permite habilitar remote debugging"
            exit 1
          fi

          # Variante Chromium (WebView): mismas garantías.
          if grep -R --line-number -E 'setWebContentsDebuggingEnabled\(true\)' app/src; then
            echo "::error::No se permite habilitar la depuración remota de WebView"
            exit 1
          fi
          if grep -R --line-number -E 'allowUniversalAccessFromFileURLs *= *true|allowFileAccessFromFileURLs *= *true|setAllowUniversalAccessFromFileURLs\(true\)|setAllowFileAccessFromFileURLs\(true\)|MIXED_CONTENT_ALWAYS_ALLOW' app/src/main app/src/chromium; then
            echo "::error::No se permite relajar el aislamiento de archivos ni el contenido mixto en WebView"
            exit 1
          fi
          if grep -R --line-number -E 'addJavascriptInterface|\.proceed\(\)' app/src/main app/src/chromium; then
            echo "::error::El puente nativo usa WebMessageListener y los errores TLS no se aceptan"
            exit 1
          fi

          # Un solo workflow con este nombre evita ejecuciones y releases duplicados.
          count="$(grep -l '^name: Nexo Secure CI' .github/workflows/*.yml | wc -l)"
          if [ "$count" -ne 1 ]; then
            echo "::error::Hay $count workflows 'Nexo Secure CI'; debe existir solo uno"
            exit 1
          fi

      - name: Extension regression tests
        run: node --test app/src/test/js/*.test.cjs

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El valor por defecto ("tools platform-tools") falla: Google retiró
          # el paquete legacy "tools". Plataforma y build-tools se instalan
          # en el paso siguiente.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Native UI theme and accessibility regressions
        if: matrix.transition == false
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testGeckoDebugUnitTest -PnexoScreenshots \
            -PnexoShotsDir="$PWD/app/build/reports/ui-previews" \
            --tests '*UiThemeRegressionTest' --tests '*SkillPracticeRegressionTest' --no-daemon --max-workers=4
          mkdir -p app/build/reports/ui-tests
          cp app/build/test-results/testGeckoDebugUnitTest/TEST-*.xml app/build/reports/ui-tests/

      - name: Build, test and lint committed source
        shell: bash
        run: |
          set -euo pipefail
          args=()
          # La actualización de transición solo existe con Gecko; la variante
          # Chromium (en migración) se compila y prueba en el resto de builds.
          flavors=(Gecko Chromium)
          if [ "$NEXO_TRANSITION" = true ]; then args+=(-PnexoTransition); flavors=(Gecko); fi
          tasks=()
          for flavor in "${flavors[@]}"; do
            tasks+=(":app:test${flavor}DebugUnitTest" ":app:test${flavor}ReleaseUnitTest"
                    ":app:assemble${flavor}Debug" ":app:assemble${flavor}Release"
                    ":app:lint${flavor}Debug" ":app:lint${flavor}Release")
          done
          gradle "${args[@]}" "${tasks[@]}" \
            --stacktrace \
            --no-daemon

      # R8 puede borrar constructores que Android o ML Kit usan por reflexión
      # al arrancar: el APK se cerraría al abrirse (Nexo 0.15.0).
      - name: Release APK keeps startup constructors
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_release_reflection.py \
            --build-tools "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" \
            app/build/outputs/apk/*/release/*.apk
          expected=com.nexo.browser
          if [ "$NEXO_TRANSITION" = true ]; then expected=com.ejemplo.navegador; fi
          python3 tools/check_apk_identity.py --build-tools "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" --package "$expected" app/build/outputs/apk/gecko/debug/*.apk app/build/outputs/apk/gecko/release/*.apk
          if [ "$NEXO_TRANSITION" != true ]; then
            python3 tools/check_apk_identity.py --build-tools "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" --package com.nexo.browser.chromium app/build/outputs/apk/chromium/debug/*.apk app/build/outputs/apk/chromium/release/*.apk
          fi

      - name: Confirm build did not mutate tracked source
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code

      - name: Upload CI outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-CI-${{ github.sha }}-transition-${{ matrix.transition }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/*/mapping.txt
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/tests/
            app/build/reports/ui-*/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'release' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Las releases solo se publican desde main"
            exit 1
          }
          test -z "$(git status --porcelain)"

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then TAG="v${VERSION_NAME}"; fi

          if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9A-Za-z._-]+$'; then
            echo "::error::Tag inválido: $TAG"
            exit 1
          fi

          # Nunca reemplazar los APK de un release ya publicado.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::El tag $TAG ya existe. Sube versionCode/versionName antes de publicar."
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Extension regression tests
        run: node --test app/src/test/js/*.test.cjs

      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          # El valor por defecto ("tools platform-tools") falla: Google retiró
          # el paquete legacy "tools". Plataforma y build-tools se instalan
          # en el paso siguiente.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${BUILD_TOOLS}" \
            "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Native UI theme and accessibility regressions
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testGeckoDebugUnitTest -PnexoScreenshots \
            --tests '*UiThemeRegressionTest' --tests '*SkillPracticeRegressionTest' --no-daemon --max-workers=4

      # La compilación corre SIN acceso a los secretos de firma.
      - name: Build release from committed source
        shell: bash
        run: |
          set -euo pipefail
          # Se publica la variante Gecko; Chromium sigue en migración.
          gradle :app:testGeckoReleaseUnitTest :app:assembleGeckoRelease :app:lintGeckoRelease --stacktrace --no-daemon
          # Solo se publica la app nueva (com.nexo.browser).
          mkdir -p build-out/new
          cp app/build/outputs/apk/gecko/release/*.apk build-out/new/
          cp app/build/outputs/mapping/geckoRelease/mapping.txt build-out/new/mapping.txt
          git diff --exit-code

      - name: Release APKs keep startup constructors and identity
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_release_reflection.py \
            --build-tools "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" \
            build-out/new/*.apk
          python3 tools/check_apk_identity.py --build-tools "$ANDROID_HOME/build-tools/${BUILD_TOOLS}" --package com.nexo.browser build-out/new/*.apk

      - name: Sign ABI APKs
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Falta el secret correspondiente a $name"
              exit 1
            fi
          done

          KEYSTORE="$RUNNER_TEMP/nexo-release.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"

          export KEYSTORE_PASSWORD KEY_PASSWORD
          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          mkdir -p artifacts/release

          pick() {
            local found
            found="$(find "$1" -type f -name "*$2*.apk" | head -n1)"
            test -n "$found" || { echo "::error::No se generó $2 en $1" >&2; exit 1; }
            printf '%s' "$found"
          }
          ARM64="$(pick build-out/new arm64-v8a)"
          ARM32="$(pick build-out/new armeabi-v7a)"

          sign_one() {
            local input="$1"
            local output="$2"
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-pass env:KEY_PASSWORD \
              --out "$output" \
              "$input"
            python3 tools/verify_apk_signature.py \
              --apksigner "$APKSIGNER" \
              --certificate config/android-signing-certificate.sha256 \
              "$output"
          }

          sign_one "$ARM64" "artifacts/release/Nexo-v${VERSION_NAME}-arm64-v8a.apk"
          sign_one "$ARM32" "artifacts/release/Nexo-v${VERSION_NAME}-armeabi-v7a.apk"

          cd artifacts/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v${{ steps.version.outputs.version_name }}-signed
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # Traduce los nombres ofuscados de los informes de cierre (r8-map-id).
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v${{ steps.version.outputs.version_name }}-mapping
          path: build-out/*/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nexo Browser v${{ steps.version.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            Nexo Browser v${{ steps.version.outputs.version_name }}

            - Build generado exclusivamente desde source ya versionado.
            - APKs firmados con la clave Android persistente del proyecto.
            - SHA-256 incluido en SHA256SUMS.txt.
            - Paquete `com.nexo.browser`: instala `Nexo-v…-arm64-v8a.apk` (o `armeabi-v7a` en teléfonos de 32 bits).
          files: |
            artifacts/release/Nexo-v${{ steps.version.outputs.version_name }}-arm64-v8a.apk
            artifacts/release/Nexo-v${{ steps.version.outputs.version_name }}-armeabi-v7a.apk
            artifacts/release/SHA256SUMS.txt
