android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx4608m -Dfile.encoding=UTF-8
kotlin.code.style=official
# AGP 9 activa por defecto el "modo estricto" de R8: una regla -keep sin
# miembros ya no conserva el constructor. Se mantiene en false por compatibilidad
# con reglas consumer heredadas de dependencias AndroidX/Chromium.
android.r8.strictFullModeForKeepRules=false
# Cefrium 0.22.0 (CefriumPlugin.groovy:432-434) genera `public static final int`
# en los R.java sintéticos de Chromium pese a indicar IDs no finales. Con R8
# optimizando org.chromium.* en 0.22.0, optimizedResourceShrinking emite 199.021
# avisos (~83 MiB) y advierte riesgo de eliminar recursos usados en ejecución.
# Retirar cuando Cefrium cambie GenerateCefriumRTask a `public static int`.
android.r8.optimizedResourceShrinking=false
